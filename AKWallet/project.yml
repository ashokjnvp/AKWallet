name: AKWallet

options:
  bundleIdPrefix: com.toppansecurity
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  AKSecurity:
    path: ../AKSecurity/AKSecurity
  AKOpenID4VCI:
    path: ../AKOpenID4VCI
  AKPresentation:
    path: ../AKPresentation

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # Set your team here or in Xcode (Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  AKWallet:
    type: application
    platform: iOS
    sources:
      - path: AKWallet
        excludes:
          - "*.entitlements"
    dependencies:
      - package: AKSecurity
      - package: AKOpenID4VCI
      - package: AKPresentation
    info:
      path: AKWallet/Info.plist
      properties:
        CFBundleDisplayName: AK Wallet
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Scan credential offers, presentation requests and QR codes."
        NSBluetoothAlwaysUsageDescription: "Share your mobile documents with a nearby reader (ISO/IEC 18013-5)."
        NSFaceIDUsageDescription: "Confirm it is you before sharing credentials."
        NFCReaderUsageDescription: "Start an in-person presentation by tapping a reader."
        # Set to true only after Apple granted the HCE entitlements and you switched to AKWallet-HCE.entitlements.
        AKNFCEngagementEnabled: false
        # Type 4 Tag NDEF application (ISO/IEC 18013-5 NFC static handover) for CardSession HCE.
        com.apple.developer.nfc.hce.iso7816.select-identifier-prefixes:
          - D2760000850101
        CFBundleURLTypes:
          - CFBundleURLName: com.toppansecurity.akwallet.offer
            CFBundleURLSchemes: [openid-credential-offer, haip-vci]
          - CFBundleURLName: com.toppansecurity.akwallet.vp
            CFBundleURLSchemes: [openid4vp, haip-vp, eudi-openid4vp, mdoc-openid4vp]
          - CFBundleURLName: com.toppansecurity.akwallet.callback
            CFBundleURLSchemes: [akwallet]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toppansecurity.akwallet
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: AKWallet/AKWallet.entitlements
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
